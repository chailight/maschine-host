        cc: 30
        default: 0
        parameter: delay-feedback
        scope: global
      - label: Time
        type: midi_cc
        port: bitbox
        channel: 1
        cc: 31
        default: 0
        parameter: delay-time
        scope: global
      - label: Pad
        type: unbound
      - label: Pad
        type: unbound
      - label: Pad
        type: unbound
      - label: Pad
        type: unbound
    profiles:
      sample:
