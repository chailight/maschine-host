# Labeled on 2026-10-26 from docs/hardware-spike/survey-session.log.
# Same timed listen as the pad, group, and screen-knob capture. Names follow
# the order that was pressed. `--listen` prints these names. The running host
# loads this file for button lamps. These controls are not page, panic, or octave.
#
# Report 0x01. A press is a bit that rises for about 200 ms, then falls.
# Report 0x20 kept flickering for a millisecond at a time and is not a button.
#
# Volume, Swing, and Tempo are button presses. The encoder is a separate
# field on byte 8, not a different report for each of those buttons.
# One clockwise detent steps 0x0f -> 0x00, then 0x00 -> 0x01 and upward.
# The matching counter-clockwise detent steps back, 0x00 -> 0x0f.
# After each of those three button presses the log shows one step out and
# back on `encoder`. The later data-encoder turn is the same byte, counted
# 0x00 through 0x08. Which parameter that encoder edits is a software mode.
# Restart is byte 5 bit 0, confirmed by docs/hardware-spike/restart-click.log.
# The master encoder click is byte 3 bit 7. Turning the encoder does not
# press that bit.
